# Image relay: pull a Docker image on a GitHub runner (which can reach
# Docker Hub) and publish it as split release assets, so it can be retrieved
# from a network where Docker Hub and every domestic mirror are throttled.
#
# Reassemble on the target host:
#   cat <part>-* | zstd -d | docker load
#
# Run manually: Actions -> fetch-image-relay -> Run workflow.
name: fetch-image-relay

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to relay, e.g. docker.io/library/alpine:3.20'
        required: true
      release_tag:
        description: 'Release tag to publish the parts under'
        required: true
        default: 'image-relay'
      part_size:
        description: 'Part size (split -b)'
        required: true
        default: '500M'

permissions:
  contents: write

env:
  REPO: 3chet/strata-gfx906-fieldnotes

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Disk space before
        run: df -h /

      - name: Pull image
        run: |
          docker pull "${{ inputs.image }}"
          docker image inspect "${{ inputs.image }}" --format '{{.Id}} size={{.Size}}'

      - name: Save, compress, split
        run: |
          set -euo pipefail
          docker save "${{ inputs.image }}" | zstd -T0 -3 -o /tmp/img.tar.zst
          ls -lh /tmp/img.tar.zst
          split -b "${{ inputs.part_size }}" /tmp/img.tar.zst /tmp/img.part-
          rm -f /tmp/img.tar.zst
          ls -lh /tmp/img.part-*
          : > /tmp/img.sha256
          for f in /tmp/img.part-*; do
            echo "$(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)" >> /tmp/img.sha256
          done
          cat /tmp/img.sha256
          df -h /

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title "Image relay: $IMAGE" \
            --notes "Temporary relay of ${IMAGE}. Parts are slices of a zstd-compressed docker-save tarball. Reassemble with: cat img.part-* | zstd -d | docker load. sha256 list is in img.sha256. Delete this release once loaded."
          for f in /tmp/img.part-* /tmp/img.sha256; do
            gh release upload "$TAG" "$f" --repo "$REPO"
            rm -f "$f"
          done
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'
